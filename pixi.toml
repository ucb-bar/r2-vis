[workspace]
name = "r2-vis"
description = "Visualization of r2-sim traces: converter (Python) and GUI (React)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2"
pyarrow = ">=17"
python-duckdb = ">=1.1"
duckdb-cli = ">=1.1"
zstandard = ">=0.23"
nodejs = "22.*"

[activation.env]
# Keep npm's cache and the Playwright browsers out of $HOME.
npm_config_cache = "$PIXI_PROJECT_ROOT/../build/npm-cache"
PLAYWRIGHT_BROWSERS_PATH = "$PIXI_PROJECT_ROOT/../build/playwright"

[pypi-dependencies]
r2t = { path = ".", editable = true }

[tasks]
synth = "python -m r2t.synth"
convert = "python -m r2t.convert"
dev = { cmd = "npm run dev", cwd = "web" }
build = { cmd = "npm run build", cwd = "web" }
